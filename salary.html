<style>
:root { --g:#2FAE8F; --gd:#1E8A70; --gl:#EAF8F3; --ink:#24403A; --sub:#7A978F; --line:#CFE9E0; --warn:#E5677B; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { -webkit-tap-highlight-color: transparent; background: var(--gl); color: var(--ink); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
button { font-family: inherit; }
#app { min-height: 100vh; padding-bottom: 60px; }
.header { background: #fff; border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top) + 14px) 16px 12px; }
.top { display: flex; align-items: center; justify-content: space-between; }
.brand { font-size: 20px; font-weight: 900; color: var(--gd); }
.gear { border: 1px solid var(--line); background: #fff; color: var(--gd); border-radius: 18px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.nav-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--gd); font-size: 18px; font-weight: 700; cursor: pointer; }
.month-title { font-size: 18px; font-weight: 800; text-align: center; }
.range { font-size: 11.5px; color: var(--sub); font-weight: 700; margin-top: 1px; }
.summary { margin: 14px 16px 0; background: linear-gradient(135deg, #3CC3A2, var(--gd)); color: #fff; border-radius: 18px; padding: 16px 18px; box-shadow: 0 6px 16px rgba(30,138,112,0.25); }
.sum-label { font-size: 12.5px; opacity: 0.9; font-weight: 700; }
.sum-money { font-size: 36px; font-weight: 900; margin-top: 2px; font-variant-numeric: tabular-nums; }
.sum-money small { font-size: 16px; margin-left: 2px; }
.sum-sub { display: flex; gap: 20px; margin-top: 8px; font-size: 13px; font-weight: 700; }
.sum-sub span b { font-size: 16px; }
.cal { margin: 16px 12px 0; }
.dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11.5px; font-weight: 700; color: var(--sub); margin-bottom: 6px; }
.dow .sun { color: #E5677B; } .dow .sat { color: #4A8FE7; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.day { aspect-ratio: 1 / 1.12; background: #fff; border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 5px 0 0; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--ink); }
.day.blank { background: none; border: none; cursor: default; }
.day.today { border: 2px solid var(--g); }
.day.work { background: #D6F3E9; border-color: #8FD6BE; }
.day .h { font-size: 10.5px; color: var(--gd); margin-top: 3px; font-weight: 800; line-height: 1.15; }
.day .m { font-size: 9.5px; color: var(--sub); font-weight: 700; }
.list-title { margin: 22px 16px 8px; font-size: 14px; font-weight: 800; color: var(--gd); }
.shift { margin: 0 16px 8px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.shift .d { font-size: 14px; font-weight: 800; }
.shift .t { font-size: 12px; color: var(--sub); margin-top: 2px; }
.shift .p { font-size: 16px; font-weight: 900; color: var(--gd); font-variant-numeric: tabular-nums; }
.empty { margin: 14px 24px; text-align: center; color: var(--sub); font-size: 13.5px; line-height: 1.8; }
.footer-tools { display: flex; gap: 10px; justify-content: center; padding: 22px 16px 0; }
.tool-btn { background: none; border: 1px solid var(--line); border-radius: 18px; color: var(--sub); font-size: 12px; font-weight: 700; padding: 8px 14px; cursor: pointer; }
.banner { margin: 12px 16px 0; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.banner.err { background: #FDE8EC; border: 1px solid #F3B7C2; color: #B3263F; }
.banner.ok { background: #E5F5EC; border: 1px solid #B5DEC5; color: #23743F; }
.overlay { position: fixed; inset: 0; background: rgba(36,64,58,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.modal { background: #fff; width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 16px 18px calc(env(safe-area-inset-bottom) + 22px); max-height: 92%; overflow-y: auto; }
.m-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.m-title { font-size: 17px; font-weight: 800; }
.close-btn { background: none; border: none; color: var(--sub); font-size: 18px; padding: 6px; cursor: pointer; }
.lbl { font-size: 11.5px; font-weight: 700; color: var(--sub); margin: 12px 0 5px; display: block; }
.inp { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--gl); padding: 11px 12px; font-size: 16px; color: var(--ink); font-family: inherit; }
.inp:focus { outline: none; border-color: var(--g); background: #fff; }
.trow { display: flex; align-items: center; gap: 8px; }
.trow select { flex: 1; border: 1px solid var(--line); border-radius: 10px; background: var(--gl); padding: 10px 6px; font-size: 16px; color: var(--ink); text-align: center; font-family: inherit; }
.trow .sep { font-weight: 800; color: var(--sub); }
.trow .to { color: var(--sub); font-weight: 700; padding: 0 2px; }
.preview { margin-top: 14px; background: var(--gl); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--sub); font-weight: 700; }
.preview b { font-size: 22px; color: var(--gd); font-weight: 900; }
.submit { margin-top: 16px; width: 100%; background: var(--g); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer; }
.del { display: block; margin: 8px auto 0; background: none; border: none; color: #C0394F; font-size: 13px; font-weight: 700; padding: 10px; cursor: pointer; }
.ferr { color: #B3263F; font-size: 12.5px; margin-top: 8px; font-weight: 700; }
.hint { font-size: 11.5px; color: var(--sub); margin-top: 6px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="import-input" accept="application/json,.json" style="display:none;" />
<script>
var KEY = "salary.v1";
var WD = ["日", "月", "火", "水", "木", "金", "土"];
function pad(n) { return String(n).padStart(2, "0"); }
function ymd(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
function todayStr() { var d = new Date(); return ymd(d.getFullYear(), d.getMonth(), d.getDate()); }
function yen(n) { return Math.round(n).toLocaleString("ja-JP"); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function range(a, b, s) { var r = []; for (var i = a; i <= b; i += s) r.push(i); return r; }
var HOURS = range(0, 23, 1), MINS = range(0, 59, 1);

var now = new Date();
var __n = new Date();
var state = { shifts: {}, wage: 1100, close: 15, year: now.getFullYear(), month: now.getMonth(), form: null, dayView: null, settings: null, error: null, notice: null };

// each day holds a list of shifts (掛け持ち). Old data had a single object per day.
function normShifts(src) {
  var out = {};
  Object.keys(src).forEach(function (k) {
    var v = src[k];
    var arr = Array.isArray(v) ? v : [v];
    arr = arr.filter(function (s) { return s && typeof s.sh === "number"; });
    if (arr.length) out[k] = arr;
  });
  return out;
}
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var d = JSON.parse(raw);
    state.shifts = normShifts(d.shifts || {});
    if (d.wage) state.wage = d.wage;
    if (d.close) state.close = d.close;
  } catch (e) { state.error = "データの読み込みに失敗しました。"; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ shifts: state.shifts, wage: state.wage, close: state.close })); return true; }
  catch (e) { flash("error", "保存に失敗しました（" + ((e && e.message) || "") + "）。"); return false; }
}
function flash(kind, msg) {
  if (kind === "error") state.error = msg; else state.notice = msg;
  render();
  setTimeout(function () { state.error = null; state.notice = null; render(); }, 3000);
}

// minutes worked; end earlier than start means past midnight
function workMinutes(s) {
  var a = s.sh * 60 + s.sm, b = s.eh * 60 + s.em;
  if (b <= a) b += 24 * 60;
  return Math.max(0, b - a);
}
function shiftPay(s) { return Math.floor(workMinutes(s) / 60 * s.wage); }
function hm(min) { var h = Math.floor(min / 60), m = min % 60; return m ? h + "時間" + m + "分" : h + "時間"; }
function tm(h, m) { return h + ":" + pad(m); }

// Period for closing month (year, month): e.g. close=15 -> previous month 16th .. this month 15th.
function period() {
  var y = state.year, m = state.month, c = state.close;
  if (c >= 28) return { s: new Date(y, m, 1), e: new Date(y, m + 1, 0) };
  return { s: new Date(y, m - 1, c + 1), e: new Date(y, m, c) };
}
function dstr(d) { return ymd(d.getFullYear(), d.getMonth(), d.getDate()); }
function monthShifts() {
  var p = period(), a = dstr(p.s), b = dstr(p.e);
  var out = [];
  Object.keys(state.shifts).sort().forEach(function (k) {
    if (k < a || k > b) return;
    state.shifts[k].map(function (s, i) { return { date: k, idx: i, s: s }; })
      .sort(function (x, y) { return (x.s.sh * 60 + x.s.sm) - (y.s.sh * 60 + y.s.sm); })
      .forEach(function (e) { out.push(e); });
  });
  return out;
}

function sel(field, val, list) {
  return '<select data-f="' + field + '">' + list.map(function (v) { return '<option value="' + v + '"' + (v === val ? " selected" : "") + '>' + pad(v) + '</option>'; }).join("") + '</select>';
}

function previewHtml(f) {
  var s = { sh: f.sh, sm: f.sm, eh: f.eh, em: f.em, wage: f.wage };
  return '<span>' + hm(workMinutes(s)) + ' 働いた</span><b>' + yen(shiftPay(s)) + '<small style="font-size:13px;"> 円</small></b>';
}

function renderModal() {
  if (state.settings) {
    return '<div class="overlay"><div class="modal"><div class="m-head"><div class="m-title">時給の設定</div><button class="close-btn" data-a="close">✕</button></div>' +
      '<label class="lbl">いまの時給（円）</label><input class="inp" id="wage-in" inputmode="numeric" value="' + esc(state.settings.wage) + '" />' +
      '<div class="hint">変えても、前に入れた日の金額は変わらへんで。これから入れる日から新しい時給になるよ。</div>' +
      '<label class="lbl">締め日</label><div class="trow"><select id="close-in">' + range(1, 28, 1).map(function (v) { return '<option value="' + v + '"' + (v === state.settings.close ? " selected" : "") + '>' + v + '日締め</option>'; }).join("") + '<option value="31"' + (state.settings.close >= 28 ? " selected" : "") + '>月末締め</option></select></div>' +
      '<div class="hint">15日締めなら、前の月の16日〜その月の15日が1か月分になるで。</div>' +
      '<button class="submit" data-a="save-wage">保存する</button></div></div>';
  }
  if (state.dayView) {
    var dv = state.dayView, dd = new Date(dv.replace(/-/g, "/")), list = state.shifts[dv] || [];
    return '<div class="overlay"><div class="modal"><div class="m-head"><div class="m-title">' + (dd.getMonth() + 1) + '月' + dd.getDate() + '日(' + WD[dd.getDay()] + ')</div><button class="close-btn" data-a="close">✕</button></div>' +
      list.map(function (s, i) {
        return '<div class="shift" style="margin:8px 0 0;" data-a="edit" data-d="' + dv + '" data-i="' + i + '"><div><div class="d">' + (s.place ? esc(s.place) : "勤務" + (i + 1)) + '</div><div class="t">' + tm(s.sh, s.sm) + '〜' + tm(s.eh, s.em) + '・' + hm(workMinutes(s)) + '</div></div><div class="p">' + yen(shiftPay(s)) + '円</div></div>';
      }).join("") +
      '<button class="submit" data-a="add-more" data-d="' + dv + '">＋ もう1つ追加（掛け持ち）</button></div></div>';
  }
  var f = state.form;
  if (!f) return "";
  var d = new Date(f.date.replace(/-/g, "/"));
  return '<div class="overlay"><div class="modal"><div class="m-head"><div class="m-title">' + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WD[d.getDay()] + ') の勤務</div><button class="close-btn" data-a="close">✕</button></div>' +
    '<label class="lbl">出勤 → 退勤</label><div class="trow">' + sel("sh", f.sh, HOURS) + '<span class="sep">:</span>' + sel("sm", f.sm, MINS) + '<span class="to">〜</span>' + sel("eh", f.eh, HOURS) + '<span class="sep">:</span>' + sel("em", f.em, MINS) + '</div>' +
    '<label class="lbl">時給（円）</label><input class="inp" id="f-wage" inputmode="numeric" value="' + esc(f.wage) + '" />' +
    '<label class="lbl">職場のメモ（なくてもOK）</label><input class="inp" id="f-place" autocomplete="off" placeholder="例：スーパー" value="' + esc(f.place) + '" />' +
    '<div class="preview" id="preview">' + previewHtml(f) + '</div>' +
    (f.err ? '<div class="ferr">' + esc(f.err) + '</div>' : "") +
    '<button class="submit" data-a="save-shift">' + (f.idx != null ? "保存する" : "追加する") + '</button>' +
    (f.idx != null ? '<button class="del" data-a="del-shift">この勤務を削除</button>' : "") + '</div></div>';
}

function renderApp() {
  var keys = monthShifts();
  var totalMin = 0, totalPay = 0;
  var dayCount = {};
  keys.forEach(function (e) { totalMin += workMinutes(e.s); totalPay += shiftPay(e.s); dayCount[e.date] = 1; });
  var per = period(), first = per.s.getDay();
  var today = todayStr();
  var h = '<div class="header"><div class="top"><div class="brand">給料計算</div><button class="gear" data-a="open-wage">時給 ' + yen(state.wage) + '円</button></div>' +
    '<div class="month-nav"><button class="nav-btn" data-a="prev">‹</button><div class="month-title">' + state.year + '年' + (state.month + 1) + '月分<div class="range">' + (per.s.getMonth() + 1) + '/' + per.s.getDate() + ' 〜 ' + (per.e.getMonth() + 1) + '/' + per.e.getDate() + '</div></div><button class="nav-btn" data-a="next">›</button></div></div>';
  if (state.error) h += '<div class="banner err">' + esc(state.error) + '</div>';
  if (state.notice) h += '<div class="banner ok">' + esc(state.notice) + '</div>';
  h += '<div class="summary"><div class="sum-label">' + (state.month + 1) + '月分のお給料</div><div class="sum-money">' + yen(totalPay) + '<small>円</small></div>' +
    '<div class="sum-sub"><span>出勤 <b>' + Object.keys(dayCount).length + '</b>日</span><span>合計 <b>' + hm(totalMin) + '</b></span></div></div>';
  h += '<div class="cal"><div class="dow">' + WD.map(function (w, i) { return '<div class="' + (i === 0 ? "sun" : i === 6 ? "sat" : "") + '">' + w + '</div>'; }).join("") + '</div><div class="grid">';
  for (var i = 0; i < first; i++) h += '<div class="day blank"></div>';
  for (var cur = new Date(per.s); cur <= per.e; cur.setDate(cur.getDate() + 1)) {
    var d = cur.getDate(), ds = dstr(cur), s = state.shifts[ds], dm = 0, dp = 0;
    (s || []).forEach(function (x) { dm += workMinutes(x); dp += shiftPay(x); });
    var lbl = (d === 1 || ds === dstr(per.s)) ? (cur.getMonth() + 1) + '/' + d : d;
    h += '<button class="day' + (s ? " work" : "") + (ds === today ? " today" : "") + '" data-a="day" data-d="' + ds + '">' + lbl +
      (s ? '<span class="h">' + (dm / 60).toFixed(1).replace(/\.0$/, "") + 'h' + (s.length > 1 ? '×' + s.length : "") + '</span><span class="m">' + yen(dp) + '</span>' : "") + '</button>';
  }
  h += '</div></div>';
  if (keys.length) {
    h += '<div class="list-title">この月の勤務</div>';
    keys.forEach(function (e) {
      var s = e.s, d = new Date(e.date.replace(/-/g, "/"));
      h += '<div class="shift" data-a="edit" data-d="' + e.date + '" data-i="' + e.idx + '"><div><div class="d">' + (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')' + (s.place ? ' ' + esc(s.place) : "") + '</div><div class="t">' + tm(s.sh, s.sm) + '〜' + tm(s.eh, s.em) + '・' + hm(workMinutes(s)) + '</div></div><div class="p">' + yen(shiftPay(s)) + '円</div></div>';
    });
  } else {
    h += '<div class="empty">まだ勤務が入ってへんで。<br>日にちをタップして、出勤と退勤の時間を入れてな。</div>';
  }
  h += '<div class="footer-tools"><button class="tool-btn" data-a="export">バックアップを書き出す</button><button class="tool-btn" data-a="import">読み込む</button></div>';
  return h + renderModal();
}

function render() {
  var scroller = document.querySelector(".modal");
  var keep = scroller ? scroller.scrollTop : 0;
  document.getElementById("app").innerHTML = renderApp();
  var m = document.querySelector(".modal"); if (m) m.scrollTop = keep;
  syncOverlay();
}
function syncOverlay() {
  var ov = document.querySelector(".overlay");
  if (!ov || !window.visualViewport) return;
  ov.style.height = window.visualViewport.height + "px";
  ov.style.top = window.visualViewport.offsetTop + "px";
}
if (window.visualViewport) { window.visualViewport.addEventListener("resize", syncOverlay); window.visualViewport.addEventListener("scroll", syncOverlay); }

function newForm(ds) { return { date: ds, idx: null, sh: 9, sm: 0, eh: 17, em: 0, wage: state.wage, place: "", err: "" }; }
function openDay(ds) {
  if (state.shifts[ds] && state.shifts[ds].length) { state.dayView = ds; state.form = null; }
  else { state.dayView = null; state.form = newForm(ds); }
  render();
}
function openEdit(ds, i) {
  var s = state.shifts[ds] && state.shifts[ds][i];
  if (!s) return;
  state.dayView = null;
  state.form = { date: ds, idx: i, sh: s.sh, sm: s.sm, eh: s.eh, em: s.em, wage: s.wage, place: s.place || "", err: "" };
  render();
}
function numVal(str) { return parseInt(String(str).replace(/[^\d]/g, ""), 10); }

function exportData() {
  try {
    var blob = new Blob([JSON.stringify({ app: "salary", version: 1, shifts: state.shifts, wage: state.wage, close: state.close }, null, 1)], { type: "application/json" });
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "salary-backup-" + todayStr() + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  } catch (e) { flash("error", "バックアップの書き出しに失敗しました。"); }
}

var app = document.getElementById("app");
app.addEventListener("click", function (e) {
  if (e.target.classList && e.target.classList.contains("overlay")) { state.form = null; state.settings = null; state.dayView = null; render(); return; }
  var el = e.target.closest("[data-a]");
  if (!el) return;
  var a = el.getAttribute("data-a");
  if (a === "prev") { state.month--; if (state.month < 0) { state.month = 11; state.year--; } render(); }
  else if (a === "next") { state.month++; if (state.month > 11) { state.month = 0; state.year++; } render(); }
  else if (a === "day") openDay(el.getAttribute("data-d"));
  else if (a === "edit") openEdit(el.getAttribute("data-d"), +el.getAttribute("data-i"));
  else if (a === "add-more") { state.dayView = null; state.form = newForm(el.getAttribute("data-d")); render(); }
  else if (a === "close") { state.form = null; state.settings = null; state.dayView = null; render(); }
  else if (a === "open-wage") { state.settings = { wage: state.wage, close: state.close }; render(); }
  else if (a === "save-wage") {
    var w = numVal(document.getElementById("wage-in").value);
    if (!w || w < 1) { flash("error", "時給を数字で入れてな"); return; }
    state.wage = w; state.close = +document.getElementById('close-in').value; state.settings = null;
    if (save()) render();
  }
  else if (a === "save-shift") {
    var f = state.form, w2 = numVal(document.getElementById("f-wage").value);
    if (!w2 || w2 < 1) { f.err = "時給を数字で入れてな"; render(); return; }
    f.wage = w2;
    var ns = { sh: f.sh, sm: f.sm, eh: f.eh, em: f.em, wage: f.wage, place: f.place };
    if (!state.shifts[f.date]) state.shifts[f.date] = [];
    if (f.idx != null) state.shifts[f.date][f.idx] = ns; else state.shifts[f.date].push(ns);
    state.form = null;
    if (save()) render();
  }
  else if (a === "del-shift") {
    if (!confirm("この勤務を削除する？")) return;
    var arr = state.shifts[state.form.date]; arr.splice(state.form.idx, 1);
    if (!arr.length) delete state.shifts[state.form.date];
    state.form = null;
    save(); render();
  }
  else if (a === "export") exportData();
  else if (a === "import") document.getElementById("import-input").click();
});
app.addEventListener("change", function (e) {
  var fld = e.target.getAttribute && e.target.getAttribute("data-f");
  if (fld && state.form) { state.form[fld] = +e.target.value; document.getElementById("preview").innerHTML = previewHtml(state.form); }
});
app.addEventListener("input", function (e) {
  if (e.target.id === "f-place" && state.form) state.form.place = e.target.value;
  if (e.target.id === "f-wage" && state.form) {
    var w = numVal(e.target.value); state.form.wage = w || 0;
    document.getElementById("preview").innerHTML = previewHtml(state.form);
  }
});
document.getElementById("import-input").addEventListener("change", function (e) {
  var file = e.target.files && e.target.files[0]; e.target.value = "";
  if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result);
      if (!d || typeof d.shifts !== "object") throw new Error("bad");
      var inc = normShifts(d.shifts);
      Object.keys(inc).forEach(function (k) { state.shifts[k] = inc[k]; });
      if (d.wage) state.wage = d.wage;
      if (d.close) state.close = d.close;
      save(); flash("ok", "読み込みました");
    } catch (err) { flash("error", "このファイルは読み込めませんでした。"); }
  };
  r.readAsText(file);
});

load();
if (state.close < 28 && __n.getDate() > state.close) { state.month++; if (state.month > 11) { state.month = 0; state.year++; } }
render();
</script>
</body>
</html>
